[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rusqlite = "0.40.2"
hex = "0.4.3"
rand = "0.8"
sha2 = "0.11.0"
tauri-plugin-clipboard-manager = "2.4.0"
rand_core = { version = "0.6", features = ["getrandom"] }
libp2p = { version = "0.57.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "macros", "request-response", "cbor", "mdns"] }
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
tauri-plugin-dialog = "2.8.0"
libp2p-stream = "0.5.0-alpha"
tokio-util = { version = "0.7.19", features = ["compat"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
